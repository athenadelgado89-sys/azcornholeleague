name: Sync Scoreholio events

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:        # "Run workflow" button for an immediate sync

permissions:
  contents: read

concurrency:
  group: scoreholio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Import Arizona tournaments from Scoreholio
        run: node scripts/sync-scoreholio.mjs
        env:
          SCOREHOLIO_API_KEY: ${{ secrets.SCOREHOLIO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCOREHOLIO_SEASON_IDS: ${{ vars.SCOREHOLIO_SEASON_IDS }}
